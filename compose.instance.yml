# Production compose for comments.themarfa.name
# Artalk image is built on GitHub Actions and pulled from GHCR — never build Artalk on the VPS.
# marfabot is a tiny Python sidecar; build it on the VPS from deploy/marfabot.
#
# Secrets (ATK_APP_KEY, ATK_ADMIN_USERS_0_PASSWORD, …) live only in .env via env_file
# so bcrypt `$` characters are not eaten by Compose interpolation.
services:
  artalk:
    image: ghcr.io/marfa/artalk:${ARTALK_IMAGE_TAG:-instance-latest}
    container_name: artalk
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:23366"
    volumes:
      - ./data:/data
    env_file:
      - .env
      - path: .env.secrets
        required: false
    environment:
      TZ: Europe/Madrid
      ATK_LOCALE: ru
      ATK_TIMEZONE: Europe/Madrid
      ATK_SITE_DEFAULT: ${ARTALK_SITE_NAME:-All-in-One Person}
      ATK_SITE_URL: ${ARTALK_SITE_URL:-https://blog.themarfa.name}
      ATK_TRUSTED_DOMAINS: ${ATK_TRUSTED_DOMAINS:-https://blog.themarfa.name https://comments.themarfa.name}
      ATK_HTTP_PROXY__HEADER: X-Forwarded-For
      ATK_ADMIN_USERS_0_NAME: ${ARTALK_ADMIN_NAME:-admin}
      ATK_ADMIN_USERS_0_EMAIL: ${ARTALK_ADMIN_EMAIL:-}
      ATK_ADMIN_USERS_0_BADGE_NAME: Admin
      ATK_ADMIN_USERS_0_BADGE_COLOR: "#0083FF"
      ATK_ADMIN_USERS_0_RECEIVE__EMAIL: "true"

  marfabot:
    build: ./deploy/marfabot
    container_name: marfabot
    restart: unless-stopped
    depends_on:
      - artalk
    volumes:
      - ./data:/data
    env_file:
      - .env
      - path: .env.secrets
        required: false
    environment:
      TZ: Europe/Madrid
      MARFABOT_CHAT_ID: ${MARFABOT_CHAT_ID:-150697169}
      MARFABOT_ALLOWED_USER_IDS: ${MARFABOT_ALLOWED_USER_IDS:-150697169}
      MARFABOT_LISTEN_HOST: 0.0.0.0
      MARFABOT_LISTEN_PORT: "8086"
      MARFABOT_BAN_FILE: /data/banned_emails.txt
      MARFABOT_SIDEBAR_URL: ${MARFABOT_SIDEBAR_URL:-https://comments.themarfa.name}
      ARTALK_API_URL: http://artalk:23366
      ARTALK_ADMIN_EMAIL: ${ARTALK_ADMIN_EMAIL:-}
      ARTALK_ADMIN_NAME: ${ARTALK_ADMIN_NAME:-admin}
      # TELEGRAM_BOT_TOKEN, MARFABOT_HOOK_SECRET, ARTALK_ADMIN_PASSWORD: env_file only
