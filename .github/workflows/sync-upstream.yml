name: Sync upstream Artalk

# Opens a PR into master when ArtalkJS/Artalk has new commits.
# Never pushes to master — review and merge the PR to build + deploy.

on:
  schedule:
    # Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch or tag to merge (e.g. master, v2.10.0)
        required: true
        default: master
        type: string

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Open upstream sync PR
    runs-on: ubuntu-latest
    # GITHUB_TOKEN cannot push .github/workflows/ changes. PAT pushes the branch;
    # GITHUB_TOKEN owns gh pr create/edit (PAT list/create was empty/"no commits").
    permissions:
      contents: read
      pull-requests: write
    env:
      UPSTREAM_REPO: https://github.com/ArtalkJS/Artalk.git
      SYNC_BRANCH: chore/upstream-latest
      # PAT: classic repo + workflow — used only for git push
      SYNC_GIT_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      # Actions app token — used for gh pr *
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: master

      - name: Configure git
        run: |
          set -euo pipefail
          if [ -z "${SYNC_GIT_TOKEN:-}" ]; then
            echo "::error::Missing repo secret UPSTREAM_SYNC_TOKEN (classic PAT: repo + workflow). GITHUB_TOKEN cannot push workflow file updates from upstream."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Authenticate git push with PAT; leave GH_TOKEN as GITHUB_TOKEN for gh pr.
          BASIC="$(printf 'x-access-token:%s' "$SYNC_GIT_TOKEN" | base64 | tr -d '\n')"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic ${BASIC}"

      - name: Merge upstream and open PR
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'master' }}
        run: |
          set -euo pipefail

          git remote add upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "$UPSTREAM_REF"
          UPSTREAM_SHA="$(git rev-parse "FETCH_HEAD")"
          echo "upstream $UPSTREAM_REF @ $UPSTREAM_SHA"

          find_sync_pr() {
            gh pr list --base master --state open --limit 50 --json number,headRefName \
              --jq ".[] | select(.headRefName == \"${SYNC_BRANCH}\") | .number" | head -n1
          }

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "master already contains upstream/$UPSTREAM_REF — nothing to do"
            EXISTING="$(find_sync_pr)"
            if [ -n "$EXISTING" ]; then
              gh pr close "$EXISTING" --comment "Closing: master already contains upstream/${UPSTREAM_REF} (${UPSTREAM_SHA})."
            fi
            exit 0
          fi

          git checkout -B "$SYNC_BRANCH"
          if ! git merge --no-ff "$UPSTREAM_SHA" -m "Merge upstream Artalk $UPSTREAM_REF"; then
            echo "::error::Merge conflict with upstream/$UPSTREAM_REF ($UPSTREAM_SHA). Resolve locally, then push a PR."
            git merge --abort || true
            exit 1
          fi

          VERSION="$(jq -r .version ui/artalk/package.json)"
          EXISTING="$(find_sync_pr)"
          echo "Existing sync PR: ${EXISTING:-none}"

          git push -u origin "HEAD:$SYNC_BRANCH" --force-with-lease

          BODY=$(cat <<EOF
          ## Summary
          Automated sync from [ArtalkJS/Artalk](https://github.com/ArtalkJS/Artalk) \`${UPSTREAM_REF}\` (\`${UPSTREAM_SHA}\`).

          - Artalk version in tree: **${VERSION}**
          - Target branch: \`master\` (merge this PR to build + deploy instance)

          ## Test plan
          - [ ] CI green on this PR
          - [ ] Skim upstream commits for breaking changes
          - [ ] Merge → confirm \`Deploy instance\` succeeds
          EOF
          )
          BODY="$(printf '%s\n' "$BODY" | sed 's/^[[:space:]]*//')"

          TITLE="chore: sync upstream Artalk ${VERSION}"

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "Updated existing PR #${EXISTING}"
            exit 0
          fi

          # Brief pause: compare API can lag right after force-push.
          sleep 5
          for attempt in 1 2 3 4 5 6; do
            if gh pr create --base master --head "$SYNC_BRANCH" --title "$TITLE" --body "$BODY"; then
              exit 0
            fi
            # PR may already exist if discovery missed it
            EXISTING="$(find_sync_pr)"
            if [ -n "$EXISTING" ]; then
              gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
              echo "Updated existing PR #${EXISTING}"
              exit 0
            fi
            echo "PR create race (attempt ${attempt}/6); sleeping…"
            sleep 5
          done
          echo "::error::Could not create sync PR for ${SYNC_BRANCH}"
          exit 1
