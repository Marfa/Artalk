name: Deploy instance

# Build Artalk on GitHub-hosted runners (not the 1.8 GiB VPS), push to GHCR, then pull+restart on the VPS.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-instance
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: marfa/artalk

permissions:
  contents: read

jobs:
  build:
    name: Build image → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=instance-latest
            type=sha,prefix=sha-,format=short

      - name: Resolve app version
        id: ver
        run: |
          ver="$(jq -r .version ui/artalk/package.json)"
          if [[ -z "$ver" || "$ver" == "null" ]]; then
            echo "Could not read ui/artalk/package.json version" >&2
            exit 1
          fi
          echo "version=v${ver}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TZ=Europe/Madrid
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=artalk-instance-amd64
          cache-to: type=gha,mode=max,scope=artalk-instance-amd64

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${IMAGE_NAME##*/}/visibility" \
            -f visibility=public || true

  deploy:
    name: Pull on VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/artalk
            if [[ ! -d .git ]]; then
              echo "ERROR: /opt/artalk is not a git clone of Marfa/Artalk yet." >&2
              echo "Run the one-time migration from deploy/README.md" >&2
              exit 1
            fi
            bash deploy/scripts/vps-deploy.sh
